<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" fill="none">
  <!-- Agnihotri Labs Full Brand Logo -->
  <defs>
    <linearGradient id="logoGrad" x1="10" y1="54" x2="54" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="50%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Geometric Circuit Symbol (Left) -->
  <g transform="translate(4, 2) scale(0.6)">
    <!-- Hexagonal tech boundary -->
    <path d="M50 8 L88 28 V72 L50 92 L12 72 V28 Z" stroke="#5eead4" stroke-opacity="0.3" stroke-width="2.5" stroke-dasharray="4 4" />
    
    <!-- Geometric A Structure -->
    <path d="M50 20 L24 78" stroke="url(#logoGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M50 20 L76 78" stroke="url(#logoGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M33 58 H67" stroke="#5eead4" stroke-width="5" stroke-linecap="round" />

    <!-- Center Lab Node -->
    <circle cx="50" cy="58" r="5" fill="#0a0e17" stroke="#5eead4" stroke-width="3" filter="url(#logoGlow)"/>
    <circle cx="50" cy="58" r="2" fill="#ffffff" />

    <!-- Top Trace -->
    <path d="M50 20 V12" stroke="#5eead4" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="50" cy="12" r="3" fill="#5eead4" />

    <circle cx="24" cy="78" r="3.5" fill="#14b8a6" />
    <circle cx="76" cy="78" r="3.5" fill="#14b8a6" />
  </g>

  <!-- Wordmark: AGNIHOTRI LABS -->
  <text x="74" y="34" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="16" letter-spacing="3" fill="#ffffff">AGNIHOTRI</text>
  <text x="210" y="34" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="16" letter-spacing="3" fill="#5eead4">LABS</text>
  
  <!-- Sub-label: Studio Tagline -->
  <text x="75" y="47" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="7.5" letter-spacing="3.2" fill="#94a3b8">BUILD. AUTOMATE. SECURE.</text>
</svg>
