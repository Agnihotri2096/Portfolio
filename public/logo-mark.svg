<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Agnihotri Labs Minimal Geometric Circuit Mark -->
  <defs>
    <linearGradient id="alGrad" x1="15" y1="85" x2="85" y2="15" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="50%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="alGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Hexagonal Frame / Tech Accent -->
  <path d="M50 8 L88 28 V72 L50 92 L12 72 V28 Z" stroke="#5eead4" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="4 4" />

  <!-- Geometric A Structure -->
  <!-- Left Leg -->
  <path d="M50 20 L24 78" stroke="url(#alGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Right Leg -->
  <path d="M50 20 L76 78" stroke="url(#alGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Circuit Crossbar -->
  <path d="M33 58 H67" stroke="#5eead4" stroke-width="4" stroke-linecap="round" />
  
  <!-- Central Tech / Lab Core -->
  <circle cx="50" cy="58" r="4.5" fill="#0a0e17" stroke="#5eead4" stroke-width="3" filter="url(#alGlow)"/>
  <circle cx="50" cy="58" r="1.8" fill="#ffffff" />

  <!-- Circuit Trace Nodes -->
  <path d="M50 20 V12" stroke="#5eead4" stroke-width="3" stroke-linecap="round" />
  <circle cx="50" cy="12" r="2.5" fill="#5eead4" />

  <circle cx="24" cy="78" r="3" fill="#14b8a6" />
  <circle cx="76" cy="78" r="3" fill="#14b8a6" />
</svg>
